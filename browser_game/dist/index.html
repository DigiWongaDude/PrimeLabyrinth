<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#090d14">
  <title>The Between — Prime Labyrinth</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game-shell">
    <canvas id="game" width="1280" height="800" aria-label="The Between isometric Prime Labyrinth"></canvas>
    <header>
      <h1>THE BETWEEN <span>/ THRESHOLDS</span></h1>
      <p id="room-info">P7 (2,2,3) · visit 2,2,3:ROOT</p>
    </header>
    <section id="status" aria-live="polite">Tap the floor to walk. Tap a doorway to travel.</section>
    <nav>
      <button id="back" type="button" disabled>Return</button>
      <button id="share" type="button">Copy path link</button>
      <div class="generation-picker">
        <button id="generation-toggle" type="button" aria-haspopup="menu">New journey ▴</button>
        <div id="generation-menu" class="generation-menu" role="menu" hidden>
          <button type="button" role="menuitem" data-generation="1">Generation 1 · Original</button>
          <button type="button" role="menuitem" data-generation="2">Generation 2 · Path architecture</button>
          <button type="button" role="menuitem" data-generation="3">Generation 3 · Room shapes</button>
        </div>
      </div>
      <button id="full" type="button">Full screen</button>
    </nav>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
